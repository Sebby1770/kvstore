\* TLC configuration for QuorumKV — a 3-replica register with R = W = 2,
\* so R + W = 4 > 3 = N. TLC explores every interleaving of writes and reads
\* across every quorum and checks that no read goes stale.
CONSTANTS
  Nodes  = {n1, n2, n3}
  Values = {a, b}
  R      = 2
  W      = 2
  MaxVer = 3

INVARIANTS
  TypeOK
  Consistency

SPECIFICATION Spec
